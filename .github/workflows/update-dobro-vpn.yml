# ============================================================================
#  ФАЙЛ: .github/workflows/update-dobro-vpn.yml  (в репозитории rewtwrtwr/prostovpn)
#  Зеркало подписки ДоброВПН (бывший Quattro — его подписка умерла).
#  Секреты репозитория: DOBROVPN_URL — ссылка подписки,
#  DOBRO_HWID — HWID зарегистрированного устройства. Панель требует
#  заголовок X-HWID: без него отдаёт заглушки, случайный HWID упрётся
#  в лимит устройств. Автообновление каждые 1.5 часа.
#  Конвертирует base64 -> Clash YAML локально, без лишних запросов.
#  Генерирует ПОЛНЫЙ конфиг (proxies + proxy-groups + rules).
#  Плюс обычная подписка dobro.txt (base64-список ссылок) — тот формат,
#  который понимают все клиенты (Happ, v2rayNG, NekoBox, INCY и т.п.),
#  как у Quattro и остальных провайдеров.
# ============================================================================
name: Update dobro-vpn.yaml

on:
  schedule:
    # every 1.5 hours: :17 of hours 0,3,6,... and :47 of hours 1,4,7,...
    - cron: '17 */3 * * *'
    - cron: '47 1,4,7,10,13,16,19,22 * * *'
  push:
    paths:
      - dobro.b64        # legacy trigger: push of the PC script (fallback path)
  workflow_dispatch:       # кнопка ручного запуска во вкладке Actions

permissions:
  contents: write

concurrency:
  group: update-dobro-vpn
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch subscription as INCY (X-HWID auth)
        env:
          DOBROVPN_URL: ${{ secrets.DOBROVPN_URL }}
          DOBRO_HWID: ${{ secrets.DOBRO_HWID }}
        run: |
          if [ -z "$DOBROVPN_URL" ] || [ -z "$DOBRO_HWID" ]; then
            echo "DOBROVPN_URL or DOBRO_HWID secret not set - falling back to dobro.b64 from the repo"
            exit 0
          fi
          # 26.11.2026: fetch as INCY (User-Agent INCY/3.9.9) so the panel serves
          # exactly what it serves to INCY. The user found the mirror was missing
          # the routing template the original subscription gets in INCY (.ru ->
          # direct): the panel serves different content per User-Agent (curl gets
          # links WITH fm, INCY gets them WITHOUT fm). Publish the response
          # VERBATIM (no reformatting) so the mirror is byte-identical to what
          # INCY receives from the original.
          if curl -s --max-time 60 -A "INCY/3.9.9" -H "X-HWID: $DOBRO_HWID" -o /tmp/dobro-new.b64 "$DOBROVPN_URL"; then
            size=$(stat -c%s /tmp/dobro-new.b64)
            echo "fetched $size bytes (INCY UA)"
            # Keep the raw INCY-UA response for structure analysis + artifact,
            # even if it fails the base64-links validation below.
            cp /tmp/dobro-new.b64 ./dobro-incy-raw
            python3 <<'PYEOF'
          import base64
          raw = open('/tmp/dobro-new.b64', encoding='utf-8').read().strip()
          # Format detection — log structure only, never the content/credentials.
          links = []
          try:
              dec = base64.b64decode(raw + '=' * (-len(raw) % 4)).decode('utf-8', 'replace')
              links = [l for l in dec.splitlines() if l.strip().startswith(('vless://', 'hysteria2://', 'ss://'))]
          except Exception:
              pass
          if links:
              fmt = 'base64-links'
          elif raw.lstrip().startswith('{'):
              fmt = 'json'
          elif 'proxies:' in raw[:500]:
              fmt = 'yaml'
          else:
              fmt = 'unknown'
          fm = sum(1 for l in links if 'fm=' in l) if links else 0
          has_routing = any(k in raw for k in ('"routing"', 'routing:', '"rules"', 'rules:', 'geoip:ru', '.ru'))
          print(f'format: {fmt} | size: {len(raw)} | links: {len(links)} | fm: {fm} | routing_keywords: {has_routing}')
          PYEOF
            if python3 <<'PYEOF'
          import base64, sys
          raw = open('/tmp/dobro-new.b64', encoding='utf-8').read().strip()
          if len(raw) < 10000:
              sys.exit('too small')
          dec = base64.b64decode(raw + '=' * (-len(raw) % 4)).decode('utf-8', 'replace')
          links = [l for l in dec.splitlines() if l.strip().startswith(('vless://', 'hysteria2://', 'ss://'))]
          bad = [l for l in links if 'HWID' in l or 'устройств' in l]
          if bad or len(links) < 50:
              sys.exit(f'placeholder or too few links: {len(links)} links, {len(bad)} bad')
          print(f'validated: {len(links)} links')
          PYEOF
            then
              cp /tmp/dobro-new.b64 dobro.b64
              echo "dobro.b64 refreshed from the subscription (INCY UA, verbatim)"
            else
              echo "WARNING: fetched content failed validation (HWID placeholder? device limit?) - keeping repo dobro.b64"
            fi
          else
            echo "WARNING: fetch failed - keeping repo dobro.b64"
          fi

      - name: Analyze INCY response structure
        run: |
          python3 <<'PYEOF'
          import json
          # Structural analysis of the raw panel response to INCY UA.
          # Logs ONLY structure (keys, counts, tags, booleans) — never
          # credentials (UUIDs, keys, passwords) or raw content.
          raw = open('dobro-incy-raw', encoding='utf-8').read()
          print(f'raw size: {len(raw)}')
          try:
              data = json.loads(raw)
              print('format: JSON')
              print('top-level keys:', list(data.keys()))
              obs = data.get('outbounds', [])
              print(f'outbounds: {len(obs)}')
              for o in obs[:8]:
                  if isinstance(o, dict):
                      print(f"  - tag={o.get('tag')} protocol={o.get('protocol')} has_finalmask={'finalmask' in o}")
              r = data.get('routing', {})
              if isinstance(r, dict):
                  print('routing keys:', list(r.keys()))
                  rules = r.get('rules', [])
                  print(f'routing rules: {len(rules)}')
                  ru_direct = 0
                  for rule in rules:
                      if not isinstance(rule, dict):
                          continue
                      if rule.get('outboundTag') == 'direct':
                          doms = rule.get('domain', [])
                          if any('.ru' in str(d) for d in doms):
                              ru_direct += 1
                  print(f'rules routing .ru to direct: {ru_direct}')
                  print('domainStrategy:', r.get('domainStrategy'))
              dns = data.get('dns', {})
              print('dns:', str(dns)[:300])
              ib = data.get('inbounds', [])
              print(f"inbounds: {len(ib)} tags: {[i.get('tag') for i in ib if isinstance(i, dict)]}")
          except Exception as e:
              print(f'not JSON ({type(e).__name__}): trying other formats')
              head = raw[:200].replace('\n', ' ')
              print('starts with:', head[:120])
          PYEOF

      - name: Upload INCY response artifact
        uses: actions/upload-artifact@v4
        with:
          name: incy-response
          path: dobro-incy-raw
          retention-days: 7

      - name: Convert dobro.b64 to full dobro-vpn.yaml
        run: |
          python3 <<'PYEOF'
          import base64, re, sys
          from datetime import datetime, timezone
          from urllib.parse import parse_qs, unquote

          SRC = "dobro.b64"
          OUT = "dobro-vpn.yaml"

          def qstr(s):
              return '"' + s.replace("\\", "\\\\").replace('"', '\\"').replace("\n", " ") + '"'

          def parse_vless(link):
              body, _, frag = link[8:].partition("#")
              name = unquote(frag) or "vless"
              userinfo_host, _, query = body.partition("?")
              if "@" not in userinfo_host:
                  return None
              uuid, _, hostport = userinfo_host.partition("@")
              host, _, port = hostport.rpartition(":")
              try:
                  port = int(port)
              except ValueError:
                  return None
              q = parse_qs(query)
              g = lambda k, d="": q.get(k, [d])[0]
              net = g("type", "tcp"); sec = g("security", "none")
              p = {"name": name, "type": "vless", "server": host, "port": port,
                   "uuid": uuid, "udp": True, "network": net}
              fp = g("fp")
              if fp:
                  p["client-fingerprint"] = fp
              if net == "ws":
                  w = {"path": g("path", "/")}
                  hh = g("host")
                  if hh:
                      w["headers"] = {"Host": hh}
                  p["ws-opts"] = w
              elif net == "grpc":
                  p["grpc-opts"] = {"grpc-service-name": g("serviceName", "")}
              if sec == "tls":
                  p["tls"] = True
                  sni = g("sni")
                  if sni:
                      p["servername"] = sni
                  alpn = g("alpn")
                  if alpn:
                      p["alpn"] = alpn.split(",")
              elif sec == "reality":
                  p["tls"] = True
                  sni = g("sni")
                  if sni:
                      p["servername"] = sni
                  p["reality-opts"] = {"public-key": g("pbk", ""), "short-id": g("sid", "")}
                  flow = g("flow")
                  if flow:
                      p["flow"] = flow
              return p

          def parse_hysteria2(link):
              body, _, frag = link[12:].partition("#")
              name = unquote(frag) or "hysteria2"
              hostq, _, query = body.partition("?")
              pwd, _, hostport = hostq.partition("@")
              host, _, port = hostport.rpartition(":")
              try:
                  port = int(port)
              except ValueError:
                  return None
              q = parse_qs(query)
              g = lambda k, d="": q.get(k, [d])[0]
              p = {"name": name, "type": "hysteria2", "server": host, "port": port,
                   "password": pwd}
              sni = g("sni")
              if sni:
                  p["sni"] = sni
              alpn = g("alpn")
              if alpn:
                  p["alpn"] = alpn.split(",")
              if g("insecure") == "1":
                  p["skip-cert-verify"] = True
              return p

          def parse_ss(link):
              body, _, frag = link[5:].partition("#")
              name = unquote(frag) or "ss"
              body = body.split("?")[0]
              if "@" in body:
                  pre, _, hostport = body.partition("@")
                  try:
                      userinfo = base64.urlsafe_b64decode(pre + "=" * (-len(pre) % 4)).decode("utf-8", "replace")
                  except Exception:
                      return None
              else:
                  try:
                      dec = base64.urlsafe_b64decode(body + "=" * (-len(body) % 4)).decode("utf-8", "replace")
                  except Exception:
                      return None
                  if "@" not in dec:
                      return None
                  userinfo, _, hostport = dec.rpartition("@")
              method, _, password = userinfo.partition(":")
              host, _, port = hostport.rpartition(":")
              try:
                  port = int(port)
              except ValueError:
                  return None
              if not method or not password or not host:
                  return None
              return {"name": name, "type": "ss", "server": host, "port": port,
                      "cipher": method, "password": password, "udp": True}

          def emit(p):
              L = [f"- name: {qstr(p['name'])}", f"  type: {p['type']}",
                   f"  server: {p['server']}", f"  port: {p['port']}"]
              if p["type"] == "vless":
                  L += [f"  uuid: {p['uuid']}", "  udp: true", f"  network: {p['network']}"]
                  if p.get("tls"):
                      L.append("  tls: true")
                  if p.get("servername"):
                      L.append(f"  servername: {p['servername']}")
                  if p.get("flow"):
                      L.append(f"  flow: {p['flow']}")
                  if p.get("client-fingerprint"):
                      L.append(f"  client-fingerprint: {p['client-fingerprint']}")
                  if p.get("alpn"):
                      L.append(f"  alpn: [{', '.join(p['alpn'])}]")
                  if "reality-opts" in p:
                      L += ["  reality-opts:",
                            f"    public-key: {p['reality-opts']['public-key']}",
                            f"    short-id: {p['reality-opts']['short-id']}"]
                  if "grpc-opts" in p:
                      L += ["  grpc-opts:",
                            f"    grpc-service-name: {qstr(p['grpc-opts']['grpc-service-name'])}"]
                  if "ws-opts" in p:
                      L += ["  ws-opts:", f"    path: {qstr(p['ws-opts']['path'])}"]
                      if "headers" in p["ws-opts"]:
                          L.append("    headers:")
                          for k, v in p["ws-opts"]["headers"].items():
                              L.append(f"      {k}: {qstr(v)}")
              elif p["type"] == "hysteria2":
                  L.append(f"  password: {p['password']}")
                  if p.get("sni"):
                      L.append(f"  sni: {p['sni']}")
                  if p.get("alpn"):
                      L.append(f"  alpn: [{', '.join(p['alpn'])}]")
                  if p.get("skip-cert-verify"):
                      L.append("  skip-cert-verify: true")
              elif p["type"] == "ss":
                  L += [f"  cipher: {qstr(p['cipher'])}", f"  password: {qstr(p['password'])}", "  udp: true"]
              return "\n".join(L)

          try:
              with open(SRC, encoding="utf-8") as f:
                  raw = f.read().strip()
          except FileNotFoundError:
              sys.exit(f"{SRC} not found — скрипт с ПК ещё ни разу не пушил")
          if len(raw) < 10000 or not re.fullmatch(r"[A-Za-z0-9+/=\s]+", raw[:1000]):
              sys.exit("dobro.b64 is not a base64 subscription, refusing to touch dobro-vpn.yaml")
          dec = base64.b64decode(raw + "=" * (-len(raw) % 4)).decode("utf-8", "replace")
          proxies, seen, skipped = [], set(), 0
          for line in dec.split("\n"):
              line = line.strip()
              if not line:
                  continue
              pr = (parse_vless(line) if line.startswith("vless://")
                    else parse_hysteria2(line) if line.startswith("hysteria2://")
                    else parse_ss(line) if line.startswith("ss://")
                    else None)
              if not pr:
                  skipped += 1
                  continue
              base, i = pr["name"], 2
              while pr["name"] in seen:
                  pr["name"] = f"{base} ({i})"; i += 1
              seen.add(pr["name"])
              proxies.append(pr)
          if len(proxies) < 50:
              sys.exit(f"suspiciously few proxies ({len(proxies)}), aborting")

          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          names = [qstr(p["name"]) for p in proxies]

          out = []
          out += ["# dobro-vpn.yaml — auto-generated FULL config, do not edit manually",
                  f"# updated: {now} | proxies: {len(proxies)} | skipped: {skipped}",
                  "# Use directly as a Clash/Mihomo profile, or as a proxy-provider.",
                  "",
                  "port: 7890",
                  "socks-port: 7891",
                  "mixed-port: 7892",
                  "allow-lan: false",
                  "mode: rule",
                  "log-level: info",
                  "ipv6: false",
                  "",
                  "proxies:"]
          out += [emit(p) for p in proxies]
          out += ["",
                  "proxy-groups:",
                  "- name: AUTO",
                  "  type: url-test",
                  "  url: https://www.gstatic.com/generate_204",
                  "  interval: 300",
                  "  tolerance: 50",
                  "  lazy: true",
                  "  proxies:"]
          out += [f"  - {n}" for n in names]
          out += ["",
                  "- name: SELECT",
                  "  type: select",
                  "  proxies:",
                  "  - AUTO",
                  "  - DIRECT",
                  "",
                  "rules:",
                  "- GEOIP,private,DIRECT,no-resolve",
                  "- MATCH,SELECT",
                  ""]
          with open(OUT, "w", encoding="utf-8") as f:
              f.write("\n".join(out))
          print(f"wrote {OUT}: {len(proxies)} proxies, {skipped} skipped (full config)")
          PYEOF

      - name: Publish plain subscription (dobro.txt)
        run: |
          python3 <<'PYEOF'
          import base64, re, sys
          raw = open('dobro.b64', encoding='utf-8').read().strip()
          dec = base64.b64decode(raw + '=' * (-len(raw) % 4)).decode('utf-8', 'replace')
          links = [l.strip() for l in dec.splitlines() if l.strip().startswith(('vless://', 'hysteria2://', 'ss://'))]
          if len(links) < 50:
              sys.exit(f'too few links for dobro.txt: {len(links)}')
          def strip_fm(link):
              # Убрать fm= (fragment/FinalMask) из vless-ссылки (26.11.2026):
              # панель отдаёт подписку С fm, а INCY при импорте ОРИГИНАЛА
              # получает узлы БЕЗ fm (в incy.db у оригинала finalmask=None
              # у всех 143 узлов, у зеркала — задан у всех 133 vless).
              # С fm INCY хранит FinalMask, и ProCloud Москва перестаёт
              # подключаться, а оригинал без fm работает. Зеркало обязано
              # публиковать ссылки БЕЗ fm, ровно как оригинал в INCY.
              # С User-Agent INCY панель сама отдаёт ссылки без fm, так что
              # strip_fm — страховка на случай, если fm вдруг вернётся.
              if 'fm=' not in link:
                  return link
              link = re.sub(r'([?&])fm=[^&#]*&', r'\1', link)
              link = re.sub(r'[?&]fm=[^&#]*', '', link)
              return link
          fm_count = sum(1 for l in links if 'fm=' in l)
          if fm_count == 0:
              # Нет fm — публикуем ответ панели ВЕРБАТИМ, без переформатирования
              # (26.11.2026, требование пользователя): тот же вид, что оригинал.
              open('dobro.txt', 'w', encoding='utf-8').write(raw)
              print(f'wrote dobro.txt verbatim: {len(links)} links, fm 0 (no reformatting)')
          else:
              links = [strip_fm(l) for l in links]
              open('dobro.txt', 'w', encoding='utf-8').write(base64.b64encode('\n'.join(links).encode('utf-8')).decode('ascii'))
              print(f'wrote dobro.txt: {len(links)} links (fm stripped from {fm_count})')
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name "dobro-vpn-autoupdate"
          git config user.email "dobro-vpn-autoupdate@users.noreply.github.com"
          git add dobro.b64 dobro-vpn.yaml dobro.txt
          if git diff --cached --quiet; then
            echo "no changes, skipping commit"
          else
            git commit -m "auto-update dobro-vpn.yaml + dobro.txt $(date -u +%Y-%m-%dT%H:%MZ)"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; echo "pushed on attempt $i"; break; fi
              echo "push rejected (attempt $i) - fetching and rebasing onto origin/main"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep 5
            done
            if [ "$ok" != "1" ]; then echo "push failed after retries"; exit 1; fi
          fi

      - name: Purge jsDelivr cache
        run: |
          curl -s -o /dev/null -w "purge http: %{http_code}\n" \
            "https://purge.jsdelivr.net/gh/rewtwrtwr/prostovpn@main/dobro-vpn.yaml"
          curl -s -o /dev/null -w "purge http: %{http_code}\n" \
            "https://purge.jsdelivr.net/gh/rewtwrtwr/prostovpn@main/dobro.txt"
