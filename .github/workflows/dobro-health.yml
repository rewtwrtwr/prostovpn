# ============================================================================
#  ФАЙЛ: .github/workflows/dobro-health.yml  (в репозитории rewtwrtwr/prostovpn)
#  "Умный" health-check подписки ДоброВПН.
#
#  Что делает (раз в 6 часов + вручную):
#    1. Берёт узлы из dobro.b64 (зеркало подписки, обновляется workflow
#       update-dobro-vpn.yml).
#    2. Качает https://status.azmov.site/data/status.json и отбирает серверы
#       со 100% аптаймом за 30 дней (d30 == 100.0). Игровые (group 'games')
#       и LTE исключаются.
#    3. Каждый такой узел живо тестирует через xray-core на раннере:
#       REALITY-handshake, выходной IP, задержка, скорость (~10 МБ).
#    4. В dobro-healthy.yaml и dobro-healthy.txt пишет ТОЛЬКО узлы,
#       которые одновременно: 100% аптайм И прошли живую проверку.
#       Плюс отчёт dobro-healthy.md с таблицей.
#  Fail-closed: если живых узлов 0 — старые healthy-файлы не трогаются.
#  Тест идёт с раннера GitHub (дата-центр), а не из Севастополя, поэтому
#  цифры задержки/скорости — это проверка живости сервера, а не точный
#  замер для домашнего канала. Точный топ по скорости — отдельный бенчмарк
#  с ПК (premium-benchmark).
# ============================================================================
name: DobroVPN healthy check

on:
  schedule:
    # каждые 6 часов, в :30 (после обновления зеркала)
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:       # кнопка ручного запуска во вкладке Actions

permissions:
  contents: write

concurrency:
  group: dobro-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xray-core
        run: |
          XRAY_VER="v26.11.9"
          curl -sL --max-time 120 -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VER}/Xray-linux-64.zip"
          unzip -o -q /tmp/xray.zip -d /tmp/xray-bin xray
          chmod +x /tmp/xray-bin/xray
          /tmp/xray-bin/xray version | head -1

      - name: Run health check
        run: |
          python3 scripts/dobro_health.py \
            --xray /tmp/xray-bin/xray \
            --b64 dobro.b64 \
            --out-dir . \
            --tmpdir /tmp/dobro-health

      - name: Commit and push if changed
        run: |
          git config user.name "dobro-health-auto"
          git config user.email "dobro-health-auto@users.noreply.github.com"
          git add dobro-healthy.yaml dobro-healthy.txt dobro-healthy.md
          if git diff --cached --quiet; then
            echo "no changes, skipping commit"
          else
            git commit -m "auto-update dobro-healthy.* $(date -u +%Y-%m-%dT%H:%MZ)"
            ok=0
            for i in 1 2 3 4 5; do
              if git push; then ok=1; echo "pushed on attempt $i"; break; fi
              echo "push rejected (attempt $i) - fetching and rebasing onto origin/main"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep 5
            done
            if [ "$ok" != "1" ]; then echo "push failed after retries"; exit 1; fi
          fi

      - name: Purge jsDelivr cache
        run: |
          curl -s -o /dev/null -w "purge healthy.yaml http: %{http_code}\n" \
            "https://purge.jsdelivr.net/gh/rewtwrtwr/prostovpn@main/dobro-healthy.yaml"
          curl -s -o /dev/null -w "purge healthy.txt http: %{http_code}\n" \
            "https://purge.jsdelivr.net/gh/rewtwrtwr/prostovpn@main/dobro-healthy.txt"
          curl -s -o /dev/null -w "purge healthy.md http: %{http_code}\n" \
            "https://purge.jsdelivr.net/gh/rewtwrtwr/prostovpn@main/dobro-healthy.md"
