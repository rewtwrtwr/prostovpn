# fetch-test.yml - one-off diagnostic: can a GitHub runner fetch the subs?
# Reports ONLY http codes, sizes and content class. Never prints URLs/HWID.
name: Fetch test (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Quattro fetch test (curl, default UA, like curl.exe on the PC)
        env:
          QUATTRO_URL: ${{ secrets.QUATTRO_URL }}
        run: |
          if [ -z "$QUATTRO_URL" ]; then echo "QUATTRO_URL secret: NOT SET"; exit 0; fi
          echo "QUATTRO_URL secret: present"
          code=$(curl -s -o /tmp/q.bin -w "%{http_code}" --max-time 60 "$QUATTRO_URL" || echo "curl-error")
          size=$(stat -c%s /tmp/q.bin 2>/dev/null || echo 0)
          echo "quattro http=$code size=$size"
          head -c 100 /tmp/q.bin | tr -d '\n' > /tmp/q.head || true
          if grep -qi "doctype\|<html\|qrator\|captcha" /tmp/q.head; then
            echo "quattro class: HTML/BOT-CHECK PAGE"
          elif head -c 1000 /tmp/q.bin | grep -qE '^[A-Za-z0-9+/=\s]+$'; then
            echo "quattro class: BASE64 subscription (looks good)"
          else
            echo "quattro class: OTHER (first bytes class unknown)"
          fi

      - name: Concord fetch test (curl + panel headers from secrets)
        env:
          CONCORD_URL: ${{ secrets.CONCORD_URL }}
          CONCORD_HWID: ${{ secrets.CONCORD_HWID }}
        run: |
          if [ -z "$CONCORD_URL" ] || [ -z "$CONCORD_HWID" ]; then echo "CONCORD secrets: NOT SET (url or hwid empty)"; exit 0; fi
          echo "CONCORD secrets: present"
          code=$(curl -s -o /tmp/c.yaml -D /tmp/c.hdr -w "%{http_code}" --max-time 60 \
            -H "User-Agent: ClashMeta" \
            -H "x-hwid: $CONCORD_HWID" \
            -H "x-device-os: Windows" \
            -H "x-ver-os: 11" \
            -H "x-device-model: PC" \
            "$CONCORD_URL" || echo "curl-error")
          size=$(stat -c%s /tmp/c.yaml 2>/dev/null || echo 0)
          echo "concord http=$code size=$size"
          grep -i "^x-hwid" /tmp/c.hdr || echo "no x-hwid response headers"
          if head -c 200 /tmp/c.yaml | grep -qi "doctype\|<html\|not supported"; then
            echo "concord class: ERROR PAGE / NOT SUPPORTED"
          else
            cnt=$(grep -c "name:" /tmp/c.yaml || true)
            echo "concord class: YAML-like, name entries=$cnt"
          fi
